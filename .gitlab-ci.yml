stages:
  - docker
  - publish

variables:
  REGISTRY: dev.wn:5000
  IMAGE_NAME: mautrix-claude

# Per-job buildx builder.
#
# The shell runner executes every project's jobs as the same user, so the buildx
# "current builder" (`docker buildx create --use`) and fixed paths such as
# /tmp/buildkitd.toml are shared by all concurrent pipelines on the host. Another
# project's job could switch the current builder mid-pipeline and our
# `imagetools create` would then talk to a builder without the dev.wn:5000 insecure
# registry config ("http: server gave HTTP response to HTTPS client").
#
# Each job therefore gets its own builder and config file, named after CI_JOB_ID.
# BUILDX_BUILDER selects the builder for every buildx command in the job without
# touching the shared current-builder state, so `--use` is intentionally absent.
#
# Jobs may set BUILDKIT_IMAGE to pin the BuildKit image; left empty, buildx uses
# its default image.
.buildx:
  tags:
    - shell
  variables:
    BUILDX_BUILDER: ${IMAGE_NAME}-${CI_JOB_ID}
    BUILDKITD_CONFIG: /tmp/buildkitd-${CI_JOB_ID}.toml
    BUILDKIT_IMAGE: ""
  before_script:
    - |
      cat > "${BUILDKITD_CONFIG}" << 'TOML'
      [registry."dev.wn:5000"]
        http = true
        insecure = true
      TOML
    - docker buildx create
        --name "${BUILDX_BUILDER}"
        --config "${BUILDKITD_CONFIG}"
        ${BUILDKIT_IMAGE:+--driver-opt image=${BUILDKIT_IMAGE}}
  after_script:
    - docker buildx rm "${BUILDX_BUILDER}" || true
    - rm -f "${BUILDKITD_CONFIG}"

docker:
  extends: .buildx
  stage: docker
  variables:
    # PINNED BUILDKIT — do not bump blindly, and do not drop without reading this.
    #
    # runc's shared-tmpfs maskPaths optimisation (opencontainers/runc#5275, shipped in
    # runc v1.3.6 and v1.4.3) masks directories with a tmpfs mounted using nr_inodes=1.
    # The dev.wn runner's kernel rejects that with EINVAL, so every RUN step — native
    # amd64 as well as emulated arm64 — dies at container init with:
    #
    #   can't mask dir "/proc/acpi": mount src=tmpfs, dst=/proc/acpi,
    #   flags=MS_RDONLY, data=nr_blocks=1,nr_inodes=1: invalid argument
    #
    # Upstream: moby/moby#52972, opencontainers/runc#5348.
    #
    # BuildKit -> bundled runc: v0.30.0 -> v1.3.5 (last unaffected release),
    # v0.31.x -> v1.3.6, v0.32.x and v0.33.0 -> v1.4.3. runc v1.5.1 (2026-07-14) added
    # an nr_inodes=2 fallback, but as of 2026-09-18 no BuildKit *release* has bumped
    # past v1.4.3 — only master has it. buildx-stable-1 resolves to v0.33.0, which is
    # why an unpinned builder broke a commit that had built fine two months earlier.
    #
    # Accepted downside: runc v1.3.5 predates the CVE-2026-41579 fix (low severity,
    # build sandbox only, trusted Dockerfiles).
    #
    # REVIEW THIS PIN when either of these happens:
    #   - the dev.wn runner host kernel is upgraded -> drop the pin, go back to default
    #   - BuildKit ships a release bundling runc >= v1.5.1 -> pin that release instead
    BUILDKIT_IMAGE: moby/buildkit:v0.30.0
  script:
    - |
      if [[ "${CI_COMMIT_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
        VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
      else
        VERSION="0.1.0-dev.${CI_COMMIT_SHORT_SHA}"
      fi
    - docker buildx build
        --platform linux/amd64,linux/arm64
        --build-arg COMMIT_HASH=${CI_COMMIT_SHA}
        --build-arg BUILD_TIME=$(date -Iseconds)
        --build-arg VERSION=${VERSION}
        -t ${REGISTRY}/${IMAGE_NAME}:${VERSION}
        -t ${REGISTRY}/${IMAGE_NAME}:latest
        -t ${REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
        --push
        .
    - |
      if [[ "${CI_COMMIT_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
        MAJOR="${BASH_REMATCH[1]}"
        MINOR="${BASH_REMATCH[2]}"
        VERSION="${MAJOR}.${MINOR}.${BASH_REMATCH[3]}"
        docker buildx imagetools create \
          -t ${REGISTRY}/${IMAGE_NAME}:${MAJOR}.${MINOR} \
          -t ${REGISTRY}/${IMAGE_NAME}:${MAJOR} \
          ${REGISTRY}/${IMAGE_NAME}:${VERSION}
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_COMMIT_TAG
      when: always
    - when: manual

dockerhub:
  extends: .buildx
  stage: publish
  retry: 2
  needs:
    - docker
  # No BuildKit pin needed here: this job only runs `imagetools create`, which
  # manipulates manifests server-side and never starts a build container, so the
  # runc maskPaths issue documented in the `docker` job cannot trigger.
  script:
    - echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
    - VERSION="${CI_COMMIT_TAG#v}"
    - MAJOR="${VERSION%%.*}"
    - MINOR="${VERSION%.*}"
    - DOCKERHUB_IMAGE="${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
    - docker buildx imagetools create
        -t ${DOCKERHUB_IMAGE}:${VERSION}
        -t ${DOCKERHUB_IMAGE}:${MINOR}
        -t ${DOCKERHUB_IMAGE}:${MAJOR}
        -t ${DOCKERHUB_IMAGE}:latest
        ${REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - docker logout
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: always
